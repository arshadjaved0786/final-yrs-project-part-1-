<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Signup — Diamond Restro & Bar</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Supabase v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>

  <style>
    /* simple centered card + small animations */
    *{box-sizing:border-box}
    body{margin:0;font-family:Segoe UI, Tahoma, Verdana, sans-serif;background:linear-gradient(180deg,#f3f4f6,#e6eef0);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:440px;background:#fff;border-radius:14px;padding:20px 22px;box-shadow:0 18px 40px rgba(8,12,20,0.08);transform-origin:center;animation:pop .28s both}
    @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.995)}to{opacity:1;transform:none}}
    h1{font-size:20px;margin:6px 0 12px;color:#111}
    label{display:block;font-weight:600;color:#444;margin-top:8px;font-size:13px}
    input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #e6eef0;margin-top:6px;font-size:15px}
    input:focus{outline:none;box-shadow:0 8px 22px rgba(6,182,167,0.06);border-color:#7dd3fc}
    .btn{width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(90deg,#06b6d4,#089191);color:#fff;font-weight:800;margin-top:14px;cursor:pointer}
    .btn[disabled]{opacity:.6;cursor:not-allowed}
    .small{font-size:13px;color:#666;margin-top:10px;text-align:center}
    a.link{color:#0b7c7c;text-decoration:underline}
    /* modal */
    .modal-back{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:999}
    .modal{width:92%;max-width:420px;background:#fff;padding:18px;border-radius:12px;box-shadow:0 20px 60px rgba(2,6,23,0.28);text-align:center}
    .modal h3{margin:0;font-size:18px}
    .modal p{color:#444;margin:10px 0 16px}
    .actions{display:flex;gap:10px;justify-content:center}
    .actions button{padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700}
    .cancel{background:#fff;border:1px solid #ddd}
    .confirm{background:linear-gradient(90deg,#10b981,#06b6d4);color:#fff}
  </style>
</head>
<body>

  <main class="card" role="main" aria-labelledby="h">
    <h1 id="h">Sign up — Diamond Restro & Bar</h1>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Create a password (min 6 chars)" autocomplete="new-password">

    <label for="confirm">Confirm Password</label>
    <input id="confirm" type="password" placeholder="Repeat password" autocomplete="new-password">

    <button id="signupBtn" class="btn" type="button">Sign Up</button>

    <div class="small">Already have an account? <a class="link" href="login.html">Login</a></div>
    <div id="inlineMsg" style="margin-top:8px;text-align:center;color:#c53030;min-height:18px"></div>
  </main>

  <!-- modal root -->
  <div id="modalRoot" aria-hidden="true"></div>

  <script>
    // ===== Supabase config (use your project values) =====
    const SUPABASE_URL = "https://pwlqaduqyixyoavyfupx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3bHFhdWR1eXhpeW9hdmZ5dXB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4NDIyMDEsImV4cCI6MjA4MDQxODIwMX0.iHqBEG6fA8MPM0eo6pRkIwxtmQ0_6OEpMVkTr3ZY964";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // elements
    const emailEl = document.getElementById('email');
    const passEl = document.getElementById('password');
    const confEl = document.getElementById('confirm');
    const btn = document.getElementById('signupBtn');
    const inlineMsg = document.getElementById('inlineMsg');
    const modalRoot = document.getElementById('modalRoot');

    // util
    function showInline(text, color='#c53030'){ inlineMsg.textContent = text; inlineMsg.style.color = color; }
    function escapeHtml(s=''){ return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'); }

    // modal helpers
    function openConfirm(title, text){
      return new Promise(resolve => {
        modalRoot.innerHTML = `<div class="modal-back" role="dialog" aria-modal="true">
          <div class="modal"><h3>${escapeHtml(title)}</h3><p>${escapeHtml(text)}</p>
            <div class="actions">
              <button class="cancel" id="mCancel">Cancel</button>
              <button class="confirm" id="mConfirm">Confirm</button>
            </div>
          </div></div>`;
        modalRoot.setAttribute('aria-hidden','false');
        const c = document.getElementById('mConfirm'), x = document.getElementById('mCancel');
        c.focus();
        function cleanup(){ modalRoot.innerHTML=''; modalRoot.setAttribute('aria-hidden','true'); c.removeEventListener('click',onC); x.removeEventListener('click',onX); }
        function onC(){ cleanup(); resolve(true); }
        function onX(){ cleanup(); resolve(false); }
        c.addEventListener('click', onC);
        x.addEventListener('click', onX);
      });
    }
    function openAlert(title, text){
      return new Promise(resolve => {
        modalRoot.innerHTML = `<div class="modal-back" role="alertdialog" aria-modal="true">
          <div class="modal"><h3>${escapeHtml(title)}</h3><p>${escapeHtml(text)}</p>
            <div class="actions"><button class="confirm" id="mOk">OK</button></div>
          </div></div>`;
        modalRoot.setAttribute('aria-hidden','false');
        const ok = document.getElementById('mOk');
        ok.focus();
        function cleanup(){ modalRoot.innerHTML=''; modalRoot.setAttribute('aria-hidden','true'); ok.removeEventListener('click',onOk); }
        function onOk(){ cleanup(); resolve(); }
        ok.addEventListener('click', onOk);
      });
    }

    // validation
    function validate(email,password,confirm){
      if(!email) return 'Please enter email';
      if(!/^\S+@\S+\.\S+$/.test(email)) return 'Please enter a valid email';
      if(!password) return 'Please enter password';
      if(password.length < 6) return 'Password must be at least 6 characters';
      if(password !== confirm) return 'Passwords do not match';
      return null;
    }

    // signup click
    btn.addEventListener('click', async ()=>{
      const email = emailEl.value.trim();
      const password = passEl.value;
      const confirm = confEl.value;
      showInline('', '#c53030');

      const v = validate(email,password,confirm);
      if(v){ showInline(v); return; }

      // show confirm popup
      const ok = await openConfirm('Confirm create account', `Create account for ${email}?`);
      if(!ok){ showInline('Signup cancelled', '#666'); return; }

      // disable while creating
      btn.disabled = true;
      btn.textContent = 'Creating...';

      try{
        const { data, error } = await supabase.auth.signUp({ email, password });
        if(error){
          await openAlert('Signup failed', error.message || 'Try again');
          showInline(error.message || 'Signup failed');
          btn.disabled = false; btn.textContent = 'Sign Up';
          return;
        }

        // success - show success alert and redirect to login
        await openAlert('Account created', 'Account created successfully. Now go to login with same email & password.');
        // clear
        emailEl.value = ''; passEl.value = ''; confEl.value = '';
        // redirect to login page
        window.location.href = 'login.html';
      }catch(err){
        console.error(err);
        await openAlert('Error', 'Unexpected error. Try again.');
        btn.disabled = false; btn.textContent = 'Sign Up';
      }
    });

    // allow enter key
    [emailEl,passEl,confEl].forEach(el=>el.addEventListener('keyup', e=>{ if(e.key==='Enter') btn.click(); }));
  </script>
</body>
</html>
