<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up | Diamond Restro & Bar</title>

  <!-- Supabase JS (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>

  <style>
    /* ---------- Page reset & fonts ---------- */
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit}

    /* ---------- Background Slideshow (images + animation) ---------- */
    .bg-slideshow { position: fixed; inset:0; z-index:-3; overflow:hidden; }
    .bg-slide { position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; transform:scale(1.03); animation:slideShow 25s infinite ease-in-out; filter:brightness(.65) contrast(1.02); }
    .bg-slide:nth-child(1) { background-image: url('https://img.freepik.com/free-photo/restaurant-interior_1127-3394.jpg'); animation-delay: 0s; }
    .bg-slide:nth-child(2) { background-image: url('https://img.freepik.com/premium-photo/beautiful-interior-chairs-bar-counter-restaurant_713163-5412.jpg'); animation-delay: 5s; }
    .bg-slide:nth-child(3) { background-image: url('https://img.freepik.com/free-photo/cocktails-shaker-arrangement-night-club_23-2149093603.jpg'); animation-delay: 10s; }
    .bg-slide:nth-child(4) { background-image: url('https://img.freepik.com/premium-photo/glass-whiskey-with-ice-bar_93675-111256.jpg'); animation-delay: 15s; }
    .bg-slide:nth-child(5) { background-image: url('https://img.freepik.com/free-photo/restaurant-interior_1127-3392.jpg'); animation-delay: 20s; }
    @keyframes slideShow {
      0% { opacity:0; transform:scale(1.02) }
      8% { opacity:1; transform:scale(1) }
      22% { opacity:1; transform:scale(1) }
      30% { opacity:0; transform:scale(1.02) }
      100% { opacity:0; transform:scale(1.02) }
    }
    .bg-overlay { position:fixed; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.45)); z-index:-2; }

    /* ---------- Centered container ---------- */
    .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px; }
    .card {
      width:100%; max-width:460px; background:linear-gradient(180deg, rgba(255,255,255,0.98), rgba(250,250,250,0.98));
      border-radius:14px; box-shadow:0 18px 50px rgba(2,6,23,0.36); padding:22px; position:relative; overflow:hidden;
      animation:cardPop .42s cubic-bezier(.2,.9,.2,1) both;
    }
    @keyframes cardPop { from{opacity:0; transform:translateY(10px) scale(.995)} to{opacity:1; transform:none} }

    /* ---------- Animated logo ---------- */
    .logo-row { display:flex; gap:12px; align-items:center; margin-bottom:8px; }
    .logo {
      width:64px; height:64px; border-radius:12px; overflow:hidden; display:inline-flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg,#fff,#f2f6f8); box-shadow:0 8px 24px rgba(2,6,23,0.12); transform-origin:center; animation:logoFloat 4s ease-in-out infinite;
      border:2px solid rgba(255,255,255,0.6);
    }
    .logo img { width:86%; height:86%; object-fit:contain; display:block; }
    @keyframes logoFloat { 0%{transform:translateY(0)} 50%{transform:translateY(-6px)} 100%{transform:translateY(0)} }

    .brand-title { font-size:18px; font-weight:800; color:#111; letter-spacing:.2px }
    .brand-sub { font-size:13px; color:#666 }

    /* ---------- Form styles ---------- */
    .form { margin-top:8px; display:grid; gap:10px; }
    label { display:block; font-size:13px; color:#444; font-weight:700; margin-bottom:6px }
    .input-wrap { position:relative }
    input[type="email"], input[type="password"] {
      width:100%; padding:12px 14px; border-radius:10px; border:2px solid #eef2f4; font-size:15px;
      transition:box-shadow .18s, border-color .18s, transform .12s;
      background:linear-gradient(180deg,#fff,#fbfbfb);
      outline:none;
    }
    input:focus { border-color:#7dd3fc; box-shadow:0 8px 20px rgba(13,148,136,0.06); transform:translateY(-2px) }
    .hint { font-size:13px; color:#777 }

    /* animated button */
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      width:100%; padding:12px; border-radius:10px; border:none; cursor:pointer;
      font-weight:800; background:linear-gradient(90deg,#06b6d4, #06a6a4); color:white;
      box-shadow:0 12px 28px rgba(6,182,167,0.14); transition:transform .12s ease, box-shadow .12s;
    }
    .btn:hover { transform:translateY(-3px); box-shadow:0 18px 34px rgba(6,182,167,0.18) }
    .btn[disabled]{opacity:.6; cursor:not-allowed; transform:none; box-shadow:none}

    /* subtle animated underline */
    .footer-note { margin-top:8px; font-size:13px; color:#666; text-align:center }

    /* ---------- Modal styles & animations ---------- */
    .modal-backdrop { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:9999; background:rgba(0,0,0,0.5); }
    .modal {
      width:92%; max-width:420px; background:#fff; border-radius:12px; padding:18px; box-shadow:0 20px 60px rgba(2,6,23,0.32);
      transform-origin:center; animation:modalPop .26s cubic-bezier(.2,.9,.2,1) both;
      text-align:center;
    }
    @keyframes modalPop { from{opacity:0; transform:translateY(8px) scale(.98)} to{opacity:1; transform:none} }

    .modal h3 { margin:0; font-size:18px; color:#111 }
    .modal p { margin:10px 0 14px; color:#444; font-size:15px }
    .modal .actions { display:flex; gap:10px; justify-content:center; margin-top:8px }
    .modal .actions .btn { width:auto; padding:9px 12px; border-radius:8px; font-weight:700 }
    .modal .btn.cancel { background:#fff; color:#333; border:1px solid #e6e6e6; box-shadow:none }
    .modal .btn.confirm { background:linear-gradient(90deg,#10b981,#06b6d4); color:#fff }

    /* success check animation inside modal */
    .check { width:78px; height:78px; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; }
    .check svg { width:56px; height:56px; }
    .check .circle { fill:none; stroke:#10b981; stroke-width:4; stroke-dasharray:200; stroke-dashoffset:200; animation:dash 0.9s ease forwards; }
    .check .tick { fill:none; stroke:#10b981; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:50; stroke-dashoffset:50; animation:tick 0.6s 0.9s ease forwards; }
    @keyframes dash { to{ stroke-dashoffset:0 } }
    @keyframes tick { to{ stroke-dashoffset:0 } }

    /* Responsive */
    @media (max-width:520px) {
      .logo{width:56px;height:56px}
      .card{padding:16px}
    }
  </style>
</head>
<body>
  <!-- background slideshow + subtle dark overlay -->
  <div class="bg-slideshow" aria-hidden="true">
    <div class="bg-slide"></div>
    <div class="bg-slide"></div>
    <div class="bg-slide"></div>
    <div class="bg-slide"></div>
    <div class="bg-slide"></div>
  </div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <div class="wrap">
    <section class="card" role="main" aria-labelledby="signup-heading">
      <div class="logo-row" role="banner">
        <div class="logo" aria-hidden="false">
          <!-- small diamond logo; you can replace src with your own -->
          <img src="https://shorturl.at/4Stns" alt="Diamond logo" />
        </div>
        <div>
          <div class="brand-title">Diamond Restro & Bar</div>
          <div class="brand-sub">Create account — access clients & orders</div>
        </div>
      </div>

      <h2 id="signup-heading" style="margin:8px 0 12px;font-size:20px;color:#111">Create Your Account</h2>

      <form class="form" onsubmit="return false" aria-describedby="form-desc">
        <div id="form-desc" class="hint" style="margin-bottom:6px;color:#666">Use an email and a secure password (min 6 chars)</div>

        <div>
          <label for="email">Email</label>
          <div class="input-wrap">
            <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>

        <div>
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" type="password" placeholder="Choose a strong password (min 6 chars)" autocomplete="new-password" required />
          </div>
        </div>

        <div>
          <label for="confirm">Confirm Password</label>
          <div class="input-wrap">
            <input id="confirm" type="password" placeholder="Repeat your password" autocomplete="new-password" required />
          </div>
        </div>

        <div>
          <button id="signupBtn" class="btn" type="button" aria-live="polite">
            <span>Sign Up</span>
          </button>
        </div>

        <div class="footer-note">
          <div class="note">Already have an account? <a href="login.html">Login</a></div>
        </div>

        <div id="msg" class="msg" role="status" aria-live="polite" style="min-height:18px;margin-top:8px;color:#c53030"></div>
      </form>
    </section>
  </div>

  <!-- Modal root (dynamically filled) -->
  <div id="modalRoot" aria-hidden="true"></div>

  <script>
    // ---------- Supabase config (same as your project) ----------
    const SUPABASE_URL = "https://pwlqaduqyixyoavyfupx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3bHFhdWR1eXhpeW9hdmZ5dXB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4NDIyMDEsImV4cCI6MjA4MDQxODIwMX0.iHqBEG6fA8MPM0eo6pRkIwxtmQ0_6OEpMVkTr3ZY964";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Elements
    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const confirmEl = document.getElementById('confirm');
    const signupBtn = document.getElementById('signupBtn');
    const msgEl = document.getElementById('msg');
    const modalRoot = document.getElementById('modalRoot');

    // Helpers
    function escapeHtml(str = '') {
      return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
    }
    function showInlineMessage(text, color = '#c53030') {
      msgEl.textContent = text; msgEl.style.color = color;
    }

    function validateInputs(email, password, confirm) {
      if (!email) return 'Please enter an email.';
      if (!/^\S+@\S+\.\S+$/.test(email)) return 'Please enter a valid email address.';
      if (!password) return 'Please enter a password.';
      if (password.length < 6) return 'Password should be at least 6 characters.';
      if (password !== confirm) return 'Passwords do not match.';
      return null;
    }

    // ---------- Modal helpers ----------
    function createModal(html) {
      modalRoot.innerHTML = html;
      modalRoot.setAttribute('aria-hidden', 'false');
      const backdrop = modalRoot.querySelector('.modal-backdrop');
      if (backdrop) backdrop.focus();
      return modalRoot;
    }
    function closeModal() {
      modalRoot.innerHTML = '';
      modalRoot.setAttribute('aria-hidden', 'true');
    }

    // showConfirm returns true/false
    function showConfirm(title, message, confirmLabel='Confirm', cancelLabel='Cancel') {
      return new Promise(resolve => {
        const html = `
          <div class="modal-backdrop" tabindex="-1" role="dialog" aria-modal="true">
            <div class="modal" role="document" aria-labelledby="modal-title">
              <h3 id="modal-title">${escapeHtml(title)}</h3>
              <p>${escapeHtml(message)}</p>
              <div class="actions">
                <button class="btn cancel" id="modalCancel">${escapeHtml(cancelLabel)}</button>
                <button class="btn confirm" id="modalConfirm">${escapeHtml(confirmLabel)}</button>
              </div>
            </div>
          </div>`;
        createModal(html);

        const confirmBtn = document.getElementById('modalConfirm');
        const cancelBtn = document.getElementById('modalCancel');
        const backdrop = modalRoot.querySelector('.modal-backdrop');

        function cleanup() { closeModal(); confirmBtn.removeEventListener('click', onConfirm); cancelBtn.removeEventListener('click', onCancel); backdrop.removeEventListener('keydown', onKey); }
        function onConfirm() { cleanup(); resolve(true); }
        function onCancel() { cleanup(); resolve(false); }
        function onKey(e) {
          if (e.key === 'Escape') onCancel();
          if (e.key === 'Enter') onConfirm();
        }

        confirmBtn.addEventListener('click', onConfirm);
        cancelBtn.addEventListener('click', onCancel);
        backdrop.addEventListener('keydown', onKey);
        confirmBtn.focus();
      });
    }

    // showAlert displays message and OK button; optional successAnimation true shows check SVG animation
    function showAlert(title, message, okLabel='OK', successAnimation=false) {
      return new Promise(resolve => {
        const checkHtml = successAnimation ? `
          <div class="check" aria-hidden="true">
            <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
              <circle class="circle" cx="26" cy="26" r="20" />
              <path class="tick" fill="none" d="M16 27 l7 7 l13 -13" />
            </svg>
          </div>` : '';

        const html = `
          <div class="modal-backdrop" tabindex="-1" role="alertdialog" aria-modal="true">
            <div class="modal" role="document" aria-labelledby="modal-title">
              ${checkHtml}
              <h3 id="modal-title">${escapeHtml(title)}</h3>
              <p>${escapeHtml(message)}</p>
              <div class="actions">
                <button class="btn confirm" id="modalOk">${escapeHtml(okLabel)}</button>
              </div>
            </div>
          </div>`;
        createModal(html);

        const okBtn = document.getElementById('modalOk');
        const backdrop = modalRoot.querySelector('.modal-backdrop');
        function cleanup() { closeModal(); okBtn.removeEventListener('click', onOk); backdrop.removeEventListener('keydown', onKey); }
        function onOk() { cleanup(); resolve(); }
        function onKey(e) { if (e.key === 'Escape' || e.key === 'Enter') onOk(); }

        okBtn.addEventListener('click', onOk);
        backdrop.addEventListener('keydown', onKey);
        okBtn.focus();
      });
    }

    // ---------- Signup flow with confirmation modal + animated success ----------

    signupBtn.addEventListener('click', async () => {
      const email = emailEl.value.trim();
      const password = passwordEl.value;
      const confirm = confirmEl.value;
      showInlineMessage('', '#c53030');

      const validationError = validateInputs(email, password, confirm);
      if (validationError) {
        showInlineMessage(validationError, '#c53030');
        return;
      }

      // Confirm
      const ok = await showConfirm('Create account?', `Create an account for ${email}?`, 'Yes, create', 'Cancel');
      if (!ok) {
        showInlineMessage('Signup cancelled.', '#666');
        return;
      }

      // disable UI
      signupBtn.disabled = true;
      signupBtn.textContent = 'Creating account...';
      try {
        const { data, error } = await supabase.auth.signUp({ email, password });

        if (error) {
          // show error modal
          await showAlert('Signup failed', error.message || 'Signup failed. Try again.', 'OK', false);
          showInlineMessage(error.message || 'Signup failed. Try again.', '#c53030');
          signupBtn.disabled = false;
          signupBtn.textContent = 'Sign Up';
          return;
        }

        // success - show animated check and message
        const successMsg = data?.user?.email ? `Account created for ${data.user.email}. Check your email for confirmation if required.` : 'Account created. Check your email if confirmation is required.';
        await showAlert('Account created', successMsg, 'OK', true);

        // clear fields and redirect to login after small delay
        emailEl.value = '';
        passwordEl.value = '';
        confirmEl.value = '';
        showInlineMessage('Created! Redirecting to login...', '#0b7c7c');
        setTimeout(() => { window.location.href = 'login.html'; }, 900);
      } catch (err) {
        console.error('Signup exception', err);
        await showAlert('Error', 'An unexpected error occurred. Please try again.', 'OK', false);
        showInlineMessage('An unexpected error occurred. Please try again.', '#c53030');
        signupBtn.disabled = false;
        signupBtn.textContent = 'Sign Up';
      }
    });

    // Enter key triggers signup
    [emailEl, passwordEl, confirmEl].forEach(el => el.addEventListener('keyup', e => {
      if (e.key === 'Enter') signupBtn.click();
    }));
  </script>
</body>
</html>
