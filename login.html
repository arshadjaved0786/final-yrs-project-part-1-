<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Diamond Restro & Bar</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:Segoe UI, Tahoma, sans-serif;background:linear-gradient(180deg,#f4f4f4,#ddd);display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{background:#fff;padding:22px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.12);width:360px}
    h2{margin:0 0 12px;font-size:20px}
    input{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin:8px 0}
    button{width:100%;padding:10px;border-radius:8px;border:none;background:#0ea5a5;color:#fff;font-weight:700;cursor:pointer}
    .note{font-size:13px;color:#666;margin-top:10px;text-align:center}
  </style>
</head>
<body>
  <div class="card">
    <h2>Login</h2>
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button id="loginBtn">Login</button>
    <div class="note">New here? <a href="signup.html">Create account</a></div>
    <p id="msg" style="color:red;font-size:13px;margin-top:8px"></p>
  </div>

  <script>
    // Supabase config
    const SUPABASE_URL = "https://pwlqaduqyixyoavyfupx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3bHFhdWR1eXhpeW9hdmZ5dXB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4NDIyMDEsImV4cCI6MjA4MDQxODIwMX0.iHqBEG6fA8MPM0eo6pRkIwxtmQ0_6OEpMVkTr3ZY964";

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const msg = document.getElementById('msg');
      msg.textContent = '';

      if (!email || !password) {
        msg.textContent = 'Please enter email and password.';
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        msg.textContent = error.message;
        return;
      }

      // Successful login — store small flag (optional) and redirect to home
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('userEmail', data.user?.email || '');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
